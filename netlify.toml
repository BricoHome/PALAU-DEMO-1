# Netlify: publica la carpeta tal cual (web estática).
# El comando de "build" solo pone la dirección real de tu web en la imagen
# que se ve al compartir el enlace por WhatsApp.
[build]
  publish = "."
  command = "sed -i \"s|__SITE_URL__|${URL:-}|g\" index.html equip.html"

# Los datos se ven al momento cuando los editas
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fuentes y librerías no cambian: se guardan mucho tiempo (carga rápida)
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
